name: psb-web
services:
  web:
    image: "${WEB_IMAGE:-psb-web-web}"
    restart: unless-stopped
    build:
      context: .
      dockerfile: web/Dockerfile
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8000}:8000"
    environment:
      LLM_BASE_URL: "${LLM_BASE_URL:-}"
      LLM_API_KEY: "${LLM_API_KEY:-}"
      LLM_MODEL: "${LLM_MODEL:-}"
      WEB_WORKERS: "${WEB_WORKERS:-2}"
      # Empty values keep the solution defaults (see README).
      LLM_REASONING_EFFORT: "${LLM_REASONING_EFFORT:-}"
      MAX_TOKENS: "${MAX_TOKENS:-}"
      TEMPERATURE: "${TEMPERATURE:-}"
      TOP_K: "${TOP_K:-}"
      # Embedding model of the same proxy for dense candidates; empty keeps BM25 only.
      EMB_MODEL: "${EMB_MODEL:-}"
      PSB_DENSE_SECONDS: "${PSB_DENSE_SECONDS:-}"
      KB_PATH: /data/knowledge-base.zip
      CHAT_HISTORY_PATH: /history/chats.sqlite3
      CHAT_PROXY_TOKEN: "${CHAT_PROXY_TOKEN:-}"
    volumes:
      - chat-history:/history
      - type: bind
        source: ./organizer/knowledge-base.zip
        target: /data/knowledge-base.zip
        read_only: true
        bind:
          create_host_path: false
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/healthz', timeout=2).close()"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  chat-history:
