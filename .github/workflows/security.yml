name: Security scans

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Monday, 07:27 Europe/Moscow. Scheduled runs use the default branch.
    - cron: "27 4 * * 1"

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"

jobs:
  workflow-lint:
    name: Workflow security
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install hash-locked scanner tools
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r .github/security/requirements.txt
      - name: Install verified actionlint binary
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          mkdir -p "$RUNNER_TEMP/actionlint" reports
          archive="$RUNNER_TEMP/actionlint/archive.tar.gz"
          curl --fail --silent --show-error --location --retry 3 --proto '=https' --tlsv1.2 \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$ACTIONLINT_SHA256" "$archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP/actionlint" actionlint
      - name: Validate workflow syntax and shell commands
        run: '"$RUNNER_TEMP/actionlint/actionlint" -color 2>&1 | tee reports/actionlint.txt'
      - name: Audit workflow permissions and unsafe patterns
        if: ${{ !cancelled() }}
        run: |
          mkdir -p reports
          zizmor --offline --no-progress --format=json \
            .github/workflows .github/dependabot.yml > reports/zizmor.json
      - name: Save workflow reports
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-workflows
          path: |
            reports/actionlint.txt
            reports/zizmor.json
          if-no-files-found: error
          retention-days: 7

  secrets:
    name: Secrets in history and files
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out all history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install verified Gitleaks binary
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          mkdir -p "$RUNNER_TEMP/gitleaks" reports
          archive="$RUNNER_TEMP/gitleaks/archive.tar.gz"
          curl --fail --silent --show-error --location --retry 3 --proto '=https' --tlsv1.2 \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "$archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP/gitleaks" gitleaks
      - name: Verify AI provider rules with synthetic fixtures
        run: |
          python .github/scripts/check_secret_rules.py "$RUNNER_TEMP/gitleaks/gitleaks" \
            --report reports/secret-rule-tests.json
      - name: Scan every fetched commit with redacted output
        if: ${{ !cancelled() }}
        run: |
          python .github/scripts/run_secret_scan.py "$RUNNER_TEMP/gitleaks/gitleaks" git \
            --report reports/gitleaks-history.json
      - name: Scan current files and supported archives
        if: ${{ !cancelled() }}
        run: |
          python .github/scripts/run_secret_scan.py "$RUNNER_TEMP/gitleaks/gitleaks" dir \
            --report reports/gitleaks-files.json
      - name: Save redacted secret report
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-secrets-redacted
          path: |
            reports/gitleaks-history.json
            reports/gitleaks-history.summary.json
            reports/gitleaks-files.json
            reports/gitleaks-files.summary.json
            reports/secret-rule-tests.json
          if-no-files-found: error
          retention-days: 7

  bandit:
    name: Python SAST
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install hash-locked scanner tools
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r .github/security/requirements.txt
      - name: Scan own Python code
        run: |
          mkdir -p reports
          bandit -r prototype .github/scripts audit_retrieval.py build_cases.py build_submission.py \
            -f json -o reports/bandit.json
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("reports/bandit.json").read_text())
          if report["errors"] or report["metrics"]["_totals"]["loc"] <= 0:
              raise SystemExit("Bandit did not analyze every expected input successfully")
          PY
      - name: Save SAST report
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-bandit
          path: reports/bandit.json
          if-no-files-found: error
          retention-days: 7

  dependencies:
    name: Dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Inventory runtime dependencies without executing the application
        id: runtime
        run: python .github/scripts/check_dependencies.py
      - name: Install hash-locked scanner tools
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r .github/security/requirements.txt
      - name: Audit all locked scanner dependencies
        run: |
          mkdir -p reports
          pip-audit --no-deps --disable-pip -r .github/security/requirements.txt \
            --format=json --output=reports/scanner-dependencies.json
      - name: Validate complete runtime lock using wheels only
        if: ${{ steps.runtime.outputs.has_dependencies == 'true' }}
        run: |
          python -m pip install --dry-run --ignore-installed --only-binary=:all: --require-hashes \
            -r prototype/requirements.lock --report reports/runtime-resolution.json
      - name: Audit locked runtime dependencies
        if: ${{ steps.runtime.outputs.has_dependencies == 'true' }}
        run: |
          pip-audit --no-deps --disable-pip -r prototype/requirements.lock \
            --format=json --output=reports/runtime-audit.json
      - name: Save dependency reports
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-dependencies
          path: |
            reports/runtime-dependencies.json
            reports/scanner-dependencies.json
            reports/runtime-resolution.json
            reports/runtime-audit.json
          if-no-files-found: error
          retention-days: 7

  codeql:
    name: CodeQL data-flow analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: python
          build-mode: none
          queries: security-extended
          config-file: ./.github/codeql/config.yml
      - name: Analyze without automatic upload
        id: analyze
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:python
          output: reports/codeql
          upload: never
          upload-database: false
      - name: Fail on high or critical findings and incomplete analysis
        run: python .github/scripts/check_codeql.py reports/codeql
      - name: Publish SARIF to GitHub code scanning
        if: >-
          ${{ !cancelled() && steps.analyze.outcome == 'success' &&
          (github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: reports/codeql
          category: /language:python
      - name: Save CodeQL report, including on fork PRs
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-codeql
          path: reports/codeql/*.sarif
          if-no-files-found: error
          retention-days: 7

  regression:
    name: Security regression / Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Test with the local stub model
        run: |
          mkdir -p reports
          python -m unittest discover -s tests -v 2>&1 | tee reports/tests.log
      - name: Check retrieval and build a fresh submission
        run: |
          python audit_retrieval.py > reports/retrieval.json
          python build_submission.py > reports/package.json
          python .github/scripts/check_submission.py
      - name: Save regression reports
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-regression-py${{ matrix.python }}
          path: |
            reports/tests.log
            reports/retrieval.json
            reports/package.json
          if-no-files-found: error
          retention-days: 7
  security-gate:
    name: Security gate
    if: ${{ always() }}
    needs: [workflow-lint, secrets, bandit, dependencies, codeql, regression]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Require every security job to succeed
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          results = json.loads(os.environ["JOB_RESULTS"])
          required = {"workflow-lint", "secrets", "bandit", "dependencies", "codeql", "regression"}
          if set(results) != required:
              raise SystemExit("Security gate is missing a required job")
          summary = ["## Security checks", "", "| Check | Result |", "| --- | --- |"]
          failed = []
          for name in sorted(required):
              status = results[name]["result"]
              summary.append(f"| {name} | {status} |")
              if status != "success":
                  failed.append(name)
          Path(os.environ["GITHUB_STEP_SUMMARY"]).write_text("\n".join(summary) + "\n")
          if failed:
              raise SystemExit("Required security checks did not succeed: " + ", ".join(failed))
          print("All required security checks passed")
          PY

  submission:
    name: Submission after security checks
    needs: security-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out the scanned source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Rebuild and verify the scanned submission
        run: |
          python build_submission.py
          python .github/scripts/check_submission.py
      - name: Save the verified submission ZIP
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verified-submission
          path: dist/PSB_baseline_submission.zip
          if-no-files-found: error
          retention-days: 7
