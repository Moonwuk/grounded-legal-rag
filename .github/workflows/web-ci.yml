name: Web CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  regression:
    uses: ./.github/workflows/regression.yml
  web:
    name: Web tests and container
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Validate web backend and imports
        run: |
          python -m pip install -r web/requirements.txt httpx==0.28.1
          python -m pip check
          python -m unittest discover -s web/tests -v
      - name: Check frontend
        run: |
          node --check web/static/app.js
          node --check web/static/archive-scene.js
          node --test web/tests/archive-scene.test.cjs
      - name: Parse PowerShell deployment scripts
        shell: pwsh
        run: |
          Get-ChildItem deployment -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count) { throw ($errors -join [Environment]::NewLine) }
          }
      - name: Check Linux deployment agent
        run: |
          shellcheck deployment/linux/psb-deploy.sh deployment/linux/test-psb-deploy.sh
          bash deployment/linux/test-psb-deploy.sh
      - name: Build and probe web stack
        run: |
          docker compose config --quiet
          docker compose up --build -d --wait --wait-timeout 90
          curl --fail --silent http://127.0.0.1:8000/healthz
          curl --fail --silent --output /dev/null http://127.0.0.1:8000/
      - name: Stop CI stack
        if: always()
        run: docker compose down
