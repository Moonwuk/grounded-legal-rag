---
- name: Refuse placeholder hosts, mutable images, and incomplete release identity
  ansible.builtin.assert:
    that:
      - not (ansible_host | default(inventory_hostname)) is search('(?i)(?:^|[.])invalid$')
      - psb_image is match('^ghcr[.]io/moonwuk/grounded-legal-rag@sha256:[0-9a-f]{64}$')
      - not psb_image.endswith('@sha256:' + ('0' * 64))
      - psb_source_commit is match('^[0-9a-f]{40}$')
      - psb_source_commit != ('0' * 40)
      - psb_llm_base_url is match('^https://[A-Za-z0-9.-]+(?::[0-9]{1,5})?(?:/[A-Za-z0-9._~/-]*)?$')
      - >-
        (psb_llm_base_url | ansible.builtin.urlsplit('port')) is none or
        (1 <= (psb_llm_base_url | ansible.builtin.urlsplit('port')) <= 65535)
      - not (psb_llm_base_url | ansible.builtin.urlsplit('hostname')) is search('(?i)(?:^|[.])invalid$')
      - psb_llm_model is match('^[A-Za-z0-9][A-Za-z0-9._:/-]{0,255}$')
      - psb_llm_model != 'CHANGE_ME'
    fail_msg: >-
      Supply a real target host, the immutable repository image, its exact
      source commit, and the trusted HTTPS proxy/model. Examples cannot deploy.

- name: Validate dedicated absolute deployment paths
  ansible.builtin.assert:
    that:
      - item is match('^/[A-Za-z0-9_.-]+(?:/[A-Za-z0-9_.-]+)*$')
      - not item is search('(?:^|/)[.]{1,2}(?:/|$)')
      - item not in ['/etc', '/usr', '/var', '/var/lib', '/home', '/opt', '/root', '/srv', '/tmp', '/bin', '/proc', '/sys', '/dev', '/run']
    fail_msg: Use dedicated absolute paths without whitespace or traversal components.
  loop:
    - "{{ psb_install_dir }}"
    - "{{ psb_data_dir }}"
    - "{{ psb_output_dir }}"
    - "{{ psb_llm_key_file }}"

- name: Keep the release, input, output, and credential scopes separate
  ansible.builtin.assert:
    that:
      - psb_data_dir != psb_output_dir
      - psb_install_dir not in [psb_data_dir, psb_output_dir]
      - not psb_output_dir.startswith(psb_data_dir + '/')
      - not psb_data_dir.startswith(psb_output_dir + '/')
      - not psb_install_dir.startswith(psb_data_dir + '/')
      - not psb_install_dir.startswith(psb_output_dir + '/')
      - not psb_data_dir.startswith(psb_install_dir + '/')
      - not psb_output_dir.startswith(psb_install_dir + '/')
      - not psb_llm_key_file.startswith(psb_data_dir + '/')
      - not psb_llm_key_file.startswith(psb_output_dir + '/')
    fail_msg: Managed data/output/release directories must not overlap or expose the credential file.

- name: Enforce resource and model-call limits
  ansible.builtin.assert:
    that:
      - psb_cpus is number and psb_cpus is not boolean
      - psb_cpus > 0 and psb_cpus <= 8
      - psb_memory_mb is integer
      - psb_memory_mb >= 128 and psb_memory_mb <= 16384
      - psb_max_workers is integer and psb_max_workers >= 1 and psb_max_workers <= 8
      - psb_top_k is integer and psb_top_k >= 1 and psb_top_k <= 40
      - psb_max_tokens is integer and psb_max_tokens >= 256 and psb_max_tokens <= 8192
      - psb_temperature is number and psb_temperature is not boolean
      - psb_temperature >= 0 and psb_temperature <= 2
      - psb_run_seconds is integer and psb_run_seconds >= 1 and psb_run_seconds <= 1150
    fail_msg: Resource and inference settings exceed the supported bounded deployment contract.

- name: Check the controller supports the attestation trust policy
  ansible.builtin.command:
    argv:
      - gh
      - attestation
      - verify
      - --help
  delegate_to: localhost
  become: false
  changed_when: false
  check_mode: false
  register: psb_gh_attestation_help

- name: Require every attestation-policy flag
  ansible.builtin.assert:
    that:
      - item in psb_gh_attestation_help.stdout
    fail_msg: Upgrade the controller GitHub CLI; the required attestation policy is unavailable.
  loop:
    - --signer-workflow
    - --source-ref
    - --source-digest
    - --deny-self-hosted-runners

- name: Verify the image and trusted main-build provenance before any host pull
  ansible.builtin.command:
    argv:
      - gh
      - attestation
      - verify
      - "oci://{{ psb_image }}"
      - --repo
      - Moonwuk/grounded-legal-rag
      - --signer-workflow
      - Moonwuk/grounded-legal-rag/.github/workflows/security.yml
      - --source-ref
      - refs/heads/main
      - --source-digest
      - "{{ psb_source_commit }}"
      - --deny-self-hosted-runners
  delegate_to: localhost
  become: false
  changed_when: false
  check_mode: false
  no_log: true

- name: Gather the existing host platform identity
  ansible.builtin.setup:
    gather_subset:
      - "!all"
      - distribution

- name: Require a supported existing Debian or Ubuntu Docker host
  ansible.builtin.assert:
    that:
      - ansible_facts.distribution in ['Debian', 'Ubuntu']
    fail_msg: This playbook targets an existing Debian/Ubuntu host; it does not provision cloud infrastructure.

- name: Check the existing Docker client and daemon
  ansible.builtin.command:
    argv:
      - docker
      - --host
      - unix:///var/run/docker.sock
      - version
  changed_when: false
  check_mode: false

- name: Check the Docker Compose plugin
  ansible.builtin.command:
    argv:
      - docker
      - --host
      - unix:///var/run/docker.sock
      - compose
      - version
      - --short
  changed_when: false
  check_mode: false

- name: Inspect Docker isolation capabilities without publishing daemon metadata
  ansible.builtin.command:
    argv:
      - docker
      - --host
      - unix:///var/run/docker.sock
      - info
      - --format
      - "{{ '{{json .}}' }}"
  changed_when: false
  check_mode: false
  register: psb_docker_info_result
  no_log: true

- name: Decode Docker isolation metadata privately
  ansible.builtin.set_fact:
    psb_docker_info: "{{ psb_docker_info_result.stdout | from_json }}"
  no_log: true

- name: Require the actual Linux amd64 resource and seccomp boundaries
  ansible.builtin.assert:
    that:
      - psb_docker_info.OSType | default('') == 'linux'
      - psb_docker_info.Architecture | default('') in ['amd64', 'x86_64']
      - psb_docker_info.MemoryLimit | default(false) is sameas true
      - psb_docker_info.PidsLimit | default(false) is sameas true
      - psb_docker_info.CpuCfsPeriod | default(false) is sameas true
      - psb_docker_info.CpuCfsQuota | default(false) is sameas true
      - >-
        psb_docker_info.SecurityOptions | default([]) |
        select('match', '^name=seccomp(?:,|$)') | list | length > 0
      - >-
        psb_docker_info.SecurityOptions | default([]) |
        select('match', '^name=(?:userns|rootless)(?:,|$)') | list | length == 0
    fail_msg: The Docker host must support Linux amd64, memory/PID/CPU quotas and seccomp, without rootless or user-namespace remapping.
  no_log: true

- name: Inspect the out-of-band credential without reading its contents
  ansible.builtin.stat:
    path: "{{ psb_llm_key_file }}"
    follow: false
    get_checksum: false
    get_mime: false
    get_attributes: false
  register: psb_secret_stat
  no_log: true

- name: Require a nonempty owner-only credential readable by container UID 10001
  ansible.builtin.assert:
    that:
      - psb_secret_stat.stat.exists
      - psb_secret_stat.stat.isreg | default(false)
      - not (psb_secret_stat.stat.islnk | default(false))
      - psb_secret_stat.stat.uid | default(-1) == 10001
      - psb_secret_stat.stat.mode | default('') == '0400'
      - psb_secret_stat.stat.size | default(0) > 0
      - psb_secret_stat.stat.size | default(0) <= 8192
    fail_msg: The existing credential must be a regular nonempty file owned by UID 10001 with mode 0400.
  no_log: true

- name: Compute the immutable release directory before inspecting write paths
  ansible.builtin.set_fact:
    psb_release_dir: "{{ psb_install_dir }}/releases/{{ psb_image.split('@sha256:')[1] }}"

- name: Enumerate every trusted ancestor before any filesystem mutation
  ansible.builtin.set_fact:
    psb_root_directories:
      - "{{ psb_install_dir }}"
      - "{{ psb_install_dir }}/releases"
      - "{{ psb_release_dir }}"
      - "{{ psb_install_dir }}/results-history"
    psb_parent_directories: >-
      {%- set ns = namespace(paths=['/']) -%}
      {%- for path in [psb_install_dir, psb_data_dir, psb_output_dir, psb_llm_key_file,
                      psb_release_dir, psb_install_dir + '/results-history'] -%}
        {%- set parts = path.split('/') -%}
        {%- for length in range(2, parts | length) -%}
          {%- set parent = parts[:length] | join('/') -%}
          {%- if parent not in ns.paths -%}
            {%- set ns.paths = ns.paths + [parent] -%}
          {%- endif -%}
        {%- endfor -%}
      {%- endfor -%}
      {{ ns.paths | sort }}

- name: Inspect every parent and managed root directory without following links
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: false
    get_checksum: false
    get_mime: false
    get_attributes: false
  loop: "{{ (psb_parent_directories + psb_root_directories) | unique | list }}"
  register: psb_trusted_directory_stats

- name: Refuse untrusted or linked ancestors before any root writes
  ansible.builtin.assert:
    that:
      - not (item.stat.exists | default(false)) or (item.stat.isdir | default(false))
      - not (item.stat.islnk | default(false))
      - not (item.stat.exists | default(false)) or item.stat.uid == 0
      - not (item.stat.exists | default(false)) or item.stat.mode is match('^[0-7]{2}[0145][0145]$')
    fail_msg: Existing ancestors and release directories must be real root-owned directories without group/world write access.
  loop: "{{ psb_trusted_directory_stats.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Inspect managed runtime directories before changing their metadata
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: false
    get_checksum: false
    get_mime: false
    get_attributes: false
  loop:
    - "{{ psb_data_dir }}"
    - "{{ psb_output_dir }}"
  register: psb_directory_stats

- name: Reject untrusted runtime directories instead of taking ownership of them
  ansible.builtin.assert:
    that:
      - not (item.stat.exists | default(false)) or (item.stat.isdir | default(false))
      - not (item.stat.islnk | default(false))
      - not (item.stat.exists | default(false)) or item.stat.uid in [0, 10001]
      - not (item.stat.exists | default(false)) or item.stat.mode is match('^[0-7]{2}[0145][0145]$')
    fail_msg: Runtime directories must be real dedicated root/UID-10001 directories without group/world write access.
  loop: "{{ psb_directory_stats.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Inspect every existing root-owned file destination before copying
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: false
    get_checksum: false
    get_mime: false
    get_attributes: false
  loop:
    - "{{ psb_install_dir }}/run-batch"
    - "{{ psb_release_dir }}/compose.yml"
    - "{{ psb_release_dir }}/.env"
  register: psb_destination_stats

- name: Refuse linked or untrusted configuration destinations
  ansible.builtin.assert:
    that:
      - not (item.stat.exists | default(false)) or (item.stat.isreg | default(false))
      - not (item.stat.islnk | default(false))
      - not (item.stat.exists | default(false)) or item.stat.uid == 0
      - not (item.stat.exists | default(false)) or item.stat.mode is match('^[0-7]{2}[0145][0145]$')
    fail_msg: Existing release files must be root-owned regular files without group/world write access.
  loop: "{{ psb_destination_stats.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Inspect the current-release selector without following it
  ansible.builtin.stat:
    path: "{{ psb_install_dir }}/current"
    follow: false
    get_checksum: false
    get_mime: false
    get_attributes: false
  register: psb_current_stat

- name: Require an absent or root-owned prepared-release selector
  ansible.builtin.assert:
    that:
      - >-
        not (psb_current_stat.stat.exists | default(false)) or
        ((psb_current_stat.stat.islnk | default(false)) and psb_current_stat.stat.uid == 0)
      - >-
        not (psb_current_stat.stat.exists | default(false)) or
        psb_current_stat.stat.lnk_source is match('^' + (psb_install_dir | regex_escape) + '/releases/[0-9a-f]{64}$')
    fail_msg: Current may only be a root-owned link to a digest-named release in this installation.

- name: Inspect both required input files without reading their contents
  ansible.builtin.stat:
    path: "{{ psb_data_dir }}/{{ item }}"
    follow: false
    get_checksum: false
    get_mime: false
    get_attributes: false
  loop:
    - questions.csv
    - knowledge-base.zip
  register: psb_input_stats

- name: Require the canonical nonempty input files
  ansible.builtin.assert:
    that:
      - item.stat.exists | default(false)
      - item.stat.isreg | default(false)
      - not (item.stat.islnk | default(false))
      - item.stat.uid | default(-1) in [0, 10001]
      - item.stat.mode | default('') is match('^[0-7]{2}[0145][0145]$')
      - item.stat.size | default(0) > 0
      - item.stat.size | default(0) <= (67108864 if item.item == 'questions.csv' else 134217728)
    fail_msg: Supply questions.csv and knowledge-base.zip as regular bounded files before preparing a release.
  loop: "{{ psb_input_stats.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Create missing trusted ancestors explicitly as root-owned directories
  ansible.builtin.file:
    path: "{{ item.item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
    follow: false
  loop: "{{ psb_trusted_directory_stats.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: not (item.stat.exists | default(false))

- name: Ensure the dedicated input directory belongs to the container UID
  ansible.builtin.file:
    path: "{{ psb_data_dir }}"
    state: directory
    owner: "10001"
    group: "10001"
    mode: "0750"
    follow: false

- name: Restrict and make the two input files readable by the container UID
  ansible.builtin.file:
    path: "{{ psb_data_dir }}/{{ item }}"
    state: file
    owner: "10001"
    group: "10001"
    mode: "0400"
    follow: false
  loop:
    - questions.csv
    - knowledge-base.zip

- name: Prepare the private output directory
  ansible.builtin.file:
    path: "{{ psb_output_dir }}"
    state: directory
    owner: "10001"
    group: "10001"
    mode: "0700"
    follow: false

- name: Prepare root-owned release directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
    follow: false
  loop:
    - "{{ psb_install_dir }}"
    - "{{ psb_install_dir }}/releases"
    - "{{ psb_release_dir }}"

- name: Prepare the private previous-result archive
  ansible.builtin.file:
    path: "{{ psb_install_dir }}/results-history"
    state: directory
    owner: root
    group: root
    mode: "0700"
    follow: false

- name: Install the locked manual runner without executing it
  ansible.builtin.copy:
    src: run_batch.py
    dest: "{{ psb_install_dir }}/run-batch"
    owner: root
    group: root
    mode: "0755"
    follow: false

- name: Install the reviewed Compose definition
  ansible.builtin.copy:
    src: "{{ playbook_dir | dirname | dirname }}/deploy/compose.yml"
    dest: "{{ psb_release_dir }}/compose.yml"
    owner: root
    group: root
    mode: "0644"
    follow: false

- name: Render only nonsecret release configuration
  ansible.builtin.template:
    src: runtime.env.j2
    dest: "{{ psb_release_dir }}/.env"
    owner: root
    group: root
    mode: "0600"
    follow: false
  no_log: true
  diff: false

- name: Validate the rendered Compose configuration without printing it
  ansible.builtin.command:
    argv:
      - docker
      - --host
      - unix:///var/run/docker.sock
      - compose
      - --project-name
      - psb
      - --env-file
      - "{{ psb_release_dir }}/.env"
      - --file
      - "{{ psb_release_dir }}/compose.yml"
      - config
      - --quiet
  changed_when: false
  when: not ansible_check_mode

- name: Pull the verified immutable image without running the application
  ansible.builtin.command:
    argv:
      - docker
      - --host
      - unix:///var/run/docker.sock
      - pull
      - "{{ psb_image }}"
  register: psb_image_pull
  changed_when: "'Downloaded newer image' in psb_image_pull.stdout"
  when: not ansible_check_mode

- name: Select the prepared release only after validation and image pull
  ansible.builtin.file:
    path: "{{ psb_install_dir }}/current"
    src: "{{ psb_release_dir }}"
    state: link
    owner: root
    group: root
    follow: false
    force: false
  when: not ansible_check_mode

- name: Show the explicit manual batch command
  ansible.builtin.debug:
    msg: >-
      Release prepared at {{ psb_release_dir }}. No batch was started.
      Run explicitly: sudo {{ psb_install_dir }}/run-batch
  when: not ansible_check_mode
